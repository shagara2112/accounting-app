# PostgreSQL untuk pengembangan lokal. Bukan konfigurasi produksi.
name: lajur-dev
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lajur
      POSTGRES_PASSWORD: lajur-dev
      POSTGRES_DB: lajur
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lajur"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata: {}
